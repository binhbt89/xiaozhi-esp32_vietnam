name: Build Mochi Approved Art Restore 15P

on:
  push:
    branches:
      - mochi-approved-art-restore-15p

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi Approved Art Restore 15P
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare hardware-PASS baseline plus 15P approved art
        shell: bash
        run: python scripts/prepare_mochi_15p.py

      - name: Verify 15P art, geometry and coin migration invariants
        shell: bash
        run: |
          set -euo pipefail
          H=main/boards/xingzhi-cube-1.83tft-wifi/mochi_lcd_display.h
          ACT=main/boards/xingzhi-cube-1.83tft-wifi/mochi_action_assets_15l.h
          P=main/pet/pet_state_engine.h
          B=main/boards/xingzhi-cube-1.83tft-wifi/xingzhi-cube-1.83tft-wifi.cc
          W=main/boards/common/wifi_board.cc
          O=main/ota.h
          A=main/application.cc

          # Stable foundations.
          grep -n 'MOCHI_MENU_LONG_PRESS_MS 1000' "$B"
          grep -n 'FeedFood' "$P"
          grep -n 'free_day' "$P"
          grep -n 'Explicit Play wakes Mochi' "$P"
          grep -n 'bool HasNewVersion() { return false; }' "$O"
          grep -n 'Saved WiFi is still unavailable' "$W"
          grep -n 'ServiceIdleLifecycle' "$A"
          grep -n 'state == kDeviceStateSpeaking' "$B"
          grep -n 'app.SetDeviceState(kDeviceStateListening)' "$B"

          # 15P must explicitly restore the approved detailed 15M artwork rather
          # than the simplified redraw used by 15O.
          grep -n 'approved 15M artwork restored' "$ACT"
          grep -n 'SAME 68x54 canvas' "$ACT"
          COUNT=$(grep -c 'LV_COLOR_FORMAT_ARGB8888, 0, 68, 54, 272, 0' "$ACT")
          test "$COUNT" -eq 9
          grep -n 'LV_COLOR_FORMAT_ARGB8888, 0, 56, 30, 224, 0' "$ACT"
          grep -n 'LV_COLOR_FORMAT_ARGB8888, 0, 38, 38, 152, 0' "$ACT"

          # Exact placement/transform guarantees.
          grep -n 'reaction_side_ = (mochi_x_ > 8) ? -1 : 1;' "$H"
          grep -n 'reaction_side_ \* 66' "$H"
          grep -n 'food_x, 64' "$H"
          grep -n 'lv_image_set_scale(obj, LV_SCALE_NONE)' "$H"
          if grep -n 'lv_image_set_scale(reaction_aux_, 320)' "$H"; then
            echo '15P regression: runtime heart interpolation returned'; exit 1
          fi
          if grep -n 'mouth_fx_x' "$H"; then
            echo '15P regression: bite sparkle returned'; exit 1
          fi

          # One-time +300 test-coin migration, persisted atomically with state.
          grep -n 'state_.coins + 300' "$P"
          grep -n 'coin300' "$P"
          grep -n 'test_coin_grant_applied_' "$P"

          # Safety invariants.
          if grep -n 'xTaskCreatePinnedToCore\|xTaskCreate(' "$H"; then
            echo '15P display layer must not add a FreeRTOS task'; exit 1
          fi
          if grep -n 'boot_button_.OnClick' "$B"; then
            echo 'Talk long-press protection regressed'; exit 1
          fi

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          idf.py --version
          python scripts/release.py xingzhi-cube-1.83tft-wifi --name xingzhi-cube-1.83tft-wifi

      - name: Verify and package APP-only image
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          set -euo pipefail
          APP=build/xiaozhi_vn.bin
          test -f "$APP"
          APP_SIZE=$(stat -c%s "$APP")
          APP_LIMIT=$((0x570000))
          if [ "$APP_SIZE" -ge "$APP_LIMIT" ]; then echo "APP too large"; exit 1; fi
          echo "APP size: $APP_SIZE / $APP_LIMIT"
          python -m esptool --chip esp32s3 image_info "$APP"
          rm -rf flash_package && mkdir flash_package
          cp "$APP" flash_package/MOCHI_APPROVED_ART_RESTORE_15P_APP.bin
          cp build/xiaozhi_vn.elf flash_package/
          cp build/xiaozhi_vn.map flash_package/
          (cd flash_package && sha256sum MOCHI_APPROVED_ART_RESTORE_15P_APP.bin > SHA256.txt)
          cat > flash_package/FLASH_INSTRUCTIONS.txt <<'EOF'
          MOCHI APPROVED ART RESTORE 15P - APP ONLY

          Baseline: 15J hardware-PASS pet/economy + 15K/15L reactions + 15N geometry.
          Flash APP at 0x20000. Do NOT erase flash.

          python -m esptool --chip esp32s3 --port COM5 --baud 921600 write-flash 0x20000 MOCHI_APPROVED_ART_RESTORE_15P_APP.bin

          15P changes:
          - Restores the detailed approved 15M/15N hand, fish, meal, dessert, heart and sparkle artwork.
          - DOES NOT use the simplified 15O redraw.
          - Quantizes the approved artwork to a controlled RGB565-snapped palette with binary alpha.
          - All nine food frames use one 68x54 fixed canvas, stable lower-base anchor and safety padding.
          - The food LVGL object does not resize or re-anchor between bites.
          - Heart is native 38x38 nearest-neighbor artwork; no runtime interpolation scaling.
          - Bite sparkle remains removed.
          - One-time +300 test coins are added and the coin300 migration flag is saved in NVS. Reboot does not grant again. Coin total clamps at 999.
          - Voice/Wi-Fi/audio/OTA behavior is unchanged.
          EOF

      - name: Upload APP-only firmware
        uses: actions/upload-artifact@v4
        with:
          name: mochi_approved_art_restore_15p_app_${{ github.sha }}
          path: flash_package/
          if-no-files-found: error
          retention-days: 30
