name: Mochi POC2

on:
  push:
    branches:
      - ci/mochi-poc2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi POC2 living pet UI for 1.83 TFT
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply proven display baseline and Mochi POC2 UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # -------------------------------------------------------------
          # 1) KEEP THE POC1.4 DISPLAY BASELINE THAT PASSED ON REAL HW
          # -------------------------------------------------------------
          cfg = Path('main/boards/xingzhi-cube-1.83tft-wifi/config.h')
          s = cfg.read_text(encoding='utf-8')
          repl = {
              '#define DISPLAY_SWAP_XY  false': '#define DISPLAY_SWAP_XY  true',
              '#define DISPLAY_MIRROR_X false': '#define DISPLAY_MIRROR_X false',
              '#define DISPLAY_MIRROR_Y false': '#define DISPLAY_MIRROR_Y true',
          }
          for old, new in repl.items():
              if old not in s:
                  raise SystemExit(f'orientation anchor not found: {old}')
              s = s.replace(old, new, 1)
          cfg.write_text(s, encoding='utf-8')

          board = Path('main/boards/xingzhi-cube-1.83tft-wifi/xingzhi-cube-1.83tft-wifi.cc')
          s = board.read_text(encoding='utf-8')
          anchor = '        ESP_ERROR_CHECK(esp_lcd_panel_init(panel_));\n'
          insert = anchor + '        ESP_ERROR_CHECK(esp_lcd_panel_set_gap(panel_, 36, 0)); // Mochi: proven physical ST7789 GRAM gap\n'
          if anchor not in s:
              raise SystemExit('panel init anchor not found')
          s = s.replace(anchor, insert, 1)
          board.write_text(s, encoding='utf-8')

          # -------------------------------------------------------------
          # 2) STABLE RUNTIME BASELINE + STATE -> MOCHI EXPRESSIONS
          # -------------------------------------------------------------
          app = Path('main/application.cc')
          s = app.read_text(encoding='utf-8')

          old = 'if (ota.HasNewVersion()) {'
          new = 'if (false && ota.HasNewVersion()) { // Mochi POC2: no automatic firmware replacement'
          if old not in s:
              raise SystemExit('OTA anchor not found')
          s = s.replace(old, new, 1)

          old_idle = 'audio_service_.EnableVoiceProcessing(false);\n            audio_service_.EnableWakeWordDetection(true);'
          new_idle = 'audio_service_.EnableVoiceProcessing(false);\n            audio_service_.EnableWakeWordDetection(false); // Mochi POC2: keep proven button-to-talk baseline'
          if old_idle not in s:
              raise SystemExit('idle wakeword anchor not found')
          s = s.replace(old_idle, new_idle, 1)

          old_speaking = 'audio_service_.EnableWakeWordDetection(audio_service_.IsAfeWakeWord());'
          new_speaking = 'audio_service_.EnableWakeWordDetection(false); // Mochi POC2: keep proven button-to-talk baseline'
          if old_speaking not in s:
              raise SystemExit('speaking wakeword anchor not found')
          s = s.replace(old_speaking, new_speaking, 1)

          old_connect = '''        case kDeviceStateConnecting:\n            display->SetStatus(Lang::Strings::CONNECTING);\n            display->SetEmotion("neutral");\n            display->SetChatMessage("system", "");'''
          new_connect = '''        case kDeviceStateConnecting:\n            display->SetStatus(Lang::Strings::CONNECTING);\n            display->SetEmotion("thinking");\n            display->SetChatMessage("system", "");'''
          if old_connect not in s:
              raise SystemExit('connecting state anchor not found')
          s = s.replace(old_connect, new_connect, 1)

          old_listen = '''        case kDeviceStateListening:\n            display->SetStatus(Lang::Strings::LISTENING);\n            display->SetEmotion("neutral");'''
          new_listen = '''        case kDeviceStateListening:\n            display->SetStatus(Lang::Strings::LISTENING);\n            display->SetEmotion("surprised");'''
          if old_listen not in s:
              raise SystemExit('listening state anchor not found')
          s = s.replace(old_listen, new_listen, 1)

          old_speak_state = '''        case kDeviceStateSpeaking:\n            display->SetStatus(Lang::Strings::SPEAKING);\n\n            if (listening_mode_ != kListeningModeRealtime) {'''
          new_speak_state = '''        case kDeviceStateSpeaking:\n            display->SetStatus(Lang::Strings::SPEAKING);\n            display->SetEmotion("happy");\n\n            if (listening_mode_ != kListeningModeRealtime) {'''
          if old_speak_state not in s:
              raise SystemExit('speaking state anchor not found')
          s = s.replace(old_speak_state, new_speak_state, 1)
          app.write_text(s, encoding='utf-8')

          # -------------------------------------------------------------
          # 3) PET SCENE LAYOUT: BUBBLE TOP, MOCHI GROUNDED AT BOTTOM
          # -------------------------------------------------------------
          lcd = Path('main/display/lcd_display.cc')
          s = lcd.read_text(encoding='utf-8')

          old_layout = '''    lv_obj_set_flex_flow(content_, LV_FLEX_FLOW_COLUMN); // Vertical layout (top to bottom)\n    lv_obj_set_flex_align(content_, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_SPACE_EVENLY); // Center-align child objects, evenly spaced\n\n    emoji_box_ = lv_obj_create(content_);\n    lv_obj_set_size(emoji_box_, LV_SIZE_CONTENT, LV_SIZE_CONTENT);\n    lv_obj_set_style_bg_opa(emoji_box_, LV_OPA_TRANSP, 0);\n    lv_obj_set_style_pad_all(emoji_box_, 0, 0);\n    lv_obj_set_style_border_width(emoji_box_, 0, 0);'''
          new_layout = '''    // Mochi POC2: absolute pet scene instead of flex-centering the pet.\n    // The wide neutral GIF animates inside this floor-level box.\n    emoji_box_ = lv_obj_create(content_);\n    lv_obj_set_size(emoji_box_, 224, 100);\n    lv_obj_align(emoji_box_, LV_ALIGN_BOTTOM_MID, 0, -2);\n    lv_obj_set_style_bg_opa(emoji_box_, LV_OPA_TRANSP, 0);\n    lv_obj_set_style_pad_all(emoji_box_, 0, 0);\n    lv_obj_set_style_border_width(emoji_box_, 0, 0);\n    lv_obj_set_scrollbar_mode(emoji_box_, LV_SCROLLBAR_MODE_OFF);'''
          if old_layout not in s:
              raise SystemExit('pet layout anchor not found')
          s = s.replace(old_layout, new_layout, 1)

          old_chat = '''    chat_message_label_ = lv_label_create(content_);\n    lv_label_set_text(chat_message_label_, "");\n    lv_obj_set_width(chat_message_label_, width_ * 0.9); // Limit width to 90% of screen width\n    lv_label_set_long_mode(chat_message_label_, LV_LABEL_LONG_WRAP); // Set to word-wrap mode\n    lv_obj_set_style_text_align(chat_message_label_, LV_TEXT_ALIGN_CENTER, 0); // Set text alignment to center\n    lv_obj_set_style_text_color(chat_message_label_, lvgl_theme->text_color(), 0);'''
          new_chat = '''    // Mochi POC2: one compact speech bubble in the upper scene.\n    chat_message_label_ = lv_label_create(content_);\n    lv_label_set_text(chat_message_label_, "");\n    lv_obj_set_width(chat_message_label_, width_ * 86 / 100);\n    lv_label_set_long_mode(chat_message_label_, LV_LABEL_LONG_WRAP);\n    lv_obj_set_style_text_align(chat_message_label_, LV_TEXT_ALIGN_CENTER, 0);\n    lv_obj_set_style_text_color(chat_message_label_, lv_color_hex(0x314968), 0);\n    lv_obj_set_style_bg_color(chat_message_label_, lv_color_hex(0xFFF1DC), 0);\n    lv_obj_set_style_bg_opa(chat_message_label_, LV_OPA_90, 0);\n    lv_obj_set_style_radius(chat_message_label_, 12, 0);\n    lv_obj_set_style_border_width(chat_message_label_, 1, 0);\n    lv_obj_set_style_border_color(chat_message_label_, lv_color_hex(0x9CB6CE), 0);\n    lv_obj_set_style_pad_all(chat_message_label_, 7, 0);\n    lv_obj_align(chat_message_label_, LV_ALIGN_TOP_MID, 0, 6);\n    lv_obj_add_flag(chat_message_label_, LV_OBJ_FLAG_HIDDEN);'''
          if old_chat not in s:
              raise SystemExit('chat label anchor not found')
          s = s.replace(old_chat, new_chat, 1)

          old_setchat = '''void LcdDisplay::SetChatMessage(const char* role, const char* content) {\n    DisplayLockGuard lock(this);\n    if (chat_message_label_ == nullptr) {\n        return;\n    }\n    lv_label_set_text(chat_message_label_, content);\n}'''
          new_setchat = '''void LcdDisplay::SetChatMessage(const char* role, const char* content) {\n    DisplayLockGuard lock(this);\n    if (chat_message_label_ == nullptr) {\n        return;\n    }\n\n    if (content == nullptr || content[0] == '\\0') {\n        lv_label_set_text(chat_message_label_, "");\n        lv_obj_add_flag(chat_message_label_, LV_OBJ_FLAG_HIDDEN);\n        return;\n    }\n\n    // Gentle role tint while keeping one consistent speech-bubble design.\n    if (role != nullptr && strcmp(role, "user") == 0) {\n        lv_obj_set_style_bg_color(chat_message_label_, lv_color_hex(0xDDEEFF), 0);\n    } else if (role != nullptr && strcmp(role, "system") == 0) {\n        lv_obj_set_style_bg_color(chat_message_label_, lv_color_hex(0xE9EEF4), 0);\n    } else {\n        lv_obj_set_style_bg_color(chat_message_label_, lv_color_hex(0xFFF1DC), 0);\n    }\n\n    lv_label_set_text(chat_message_label_, content);\n    lv_obj_remove_flag(chat_message_label_, LV_OBJ_FLAG_HIDDEN);\n    lv_obj_align(chat_message_label_, LV_ALIGN_TOP_MID, 0, 6);\n    lv_obj_move_foreground(chat_message_label_);\n}'''
          if old_setchat not in s:
              raise SystemExit('SetChatMessage anchor not found')
          s = s.replace(old_setchat, new_setchat, 1)

          lcd.write_text(s, encoding='utf-8')
          print('POC2 patch: display baseline locked; pet grounded; top speech bubble; state expressions mapped')
          PY

      - name: Match current 16MB device partition layout
        shell: bash
        run: |
          cat > partitions/v2/mochi_current_16m.csv <<'EOF'
          # ESP-IDF Partition Table
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,    0x4000,
          otadata,  data, ota,     0xd000,    0x2000,
          phy_init, data, phy,     0xf000,    0x1000,
          ota_0,    app,  ota_0,   0x20000,   0x570000,
          ota_1,    app,  ota_1,   0x590000,  0x570000,
          assets,   data, spiffs,  0xB00000,  0x500000
          EOF

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('main/boards/xingzhi-cube-1.83tft-wifi/config.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          build = data['builds'][0]
          build['name'] = 'xingzhi-cube-1.83tft-wifi'
          opts = [x for x in build.get('sdkconfig_append', [])
                  if not x.startswith('CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=')
                  and not x.startswith('CONFIG_ESPTOOLPY_FLASHSIZE_')]
          opts += [
              'CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y',
              'CONFIG_PARTITION_TABLE_CUSTOM=y',
              'CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/mochi_current_16m.csv"',
          ]
          build['sdkconfig_append'] = opts
          p.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          print('Using current-device layout: ota0 0x20000/0x570000, ota1 0x590000/0x570000, assets 0xB00000/0x500000')
          PY

      - name: Build target board
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py xingzhi-cube-1.83tft-wifi --name xingzhi-cube-1.83tft-wifi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: mochi-poc2-${{ github.sha }}
          path: |
            build/merged-binary.bin
            build/partition_table/partition-table.bin
            releases/*.zip
          if-no-files-found: error
