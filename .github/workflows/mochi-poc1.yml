name: Mochi POC1

on:
  push:
    branches:
      - ci/mochi-poc1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi POC1 for 1.83 TFT
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Mochi POC1 source overlay
        shell: bash
        run: python scripts/apply_mochi_poc1.py

      - name: Match tested hardware orientation and keep OTA from replacing POC
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cfg = Path('main/boards/xingzhi-cube-1.83tft-wifi/config.h')
          s = cfg.read_text(encoding='utf-8')
          old = '#define DISPLAY_SWAP_XY  false'
          new = '#define DISPLAY_SWAP_XY  true'
          if old not in s:
              raise SystemExit('DISPLAY_SWAP_XY anchor not found')
          cfg.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('ST7789 logical 284x240 now uses XY swap for physical 240x284 panel')

          app = Path('main/application.cc')
          s = app.read_text(encoding='utf-8')
          old = 'if (ota.HasNewVersion()) {'
          new = 'if (false && ota.HasNewVersion()) { // Mochi POC: never auto-replace test firmware'
          if old not in s:
              raise SystemExit('OTA upgrade anchor not found')
          app.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('OTA metadata/broker check preserved; automatic firmware replacement disabled for POC')
          PY

      - name: Match current 16MB device partition layout
        shell: bash
        run: |
          cat > partitions/v2/mochi_current_16m.csv <<'EOF'
          # ESP-IDF Partition Table
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,    0x4000,
          otadata,  data, ota,     0xd000,    0x2000,
          phy_init, data, phy,     0xf000,    0x1000,
          ota_0,    app,  ota_0,   0x20000,   0x570000,
          ota_1,    app,  ota_1,   0x590000,  0x570000,
          assets,   data, spiffs,  0xB00000,  0x500000
          EOF

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('main/boards/xingzhi-cube-1.83tft-wifi/config.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          build = data['builds'][0]
          build['name'] = 'xingzhi-cube-1.83tft-wifi'
          opts = [x for x in build.get('sdkconfig_append', [])
                  if not x.startswith('CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=')
                  and not x.startswith('CONFIG_ESPTOOLPY_FLASHSIZE_')]
          opts += [
              'CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y',
              'CONFIG_PARTITION_TABLE_CUSTOM=y',
              'CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/mochi_current_16m.csv"',
          ]
          build['sdkconfig_append'] = opts
          p.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          print('Using current-device layout: ota0 0x20000/0x570000, ota1 0x590000/0x570000, assets 0xB00000/0x500000')
          PY

      - name: Build target board
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py xingzhi-cube-1.83tft-wifi --name xingzhi-cube-1.83tft-wifi

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: mochi-poc1-${{ github.sha }}
          path: |
            build/merged-binary.bin
            build/partition_table/partition-table.bin
            releases/*.zip
          if-no-files-found: error