name: Build Mochi Xingzhi 284x240 Fix

on:
  push:
    branches:
      - ci/mochi-183-fix

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi 284x240
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mochi Xingzhi 284x240
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py xingzhi-cube-1.54tft-wifi --name xingzhi-cube-1.54tft-wifi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochi_xingzhi_284x240_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
          retention-days: 30
