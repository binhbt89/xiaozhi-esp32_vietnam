name: Build Mochi Final Xingzhi 1.83

on:
  push:
    branches:
      - mochi-final-183-v1

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi final 1.83
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build corrected 1.83 firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py xingzhi-cube-1.83tft-wifi --name xingzhi-cube-1.83tft-wifi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochi_final_183_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
          retention-days: 30
