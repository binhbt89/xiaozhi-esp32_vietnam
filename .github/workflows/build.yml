name: Build Mochi Pet State Core 15A

on:
  push:
    branches:
      - mochi-pet-state-core-15a

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi pet state core 15A
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore factory-era task stack sizes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main/application.cc')
          text = p.read_text(encoding='utf-8')
          old = '}, "main_event_loop", 1024 * 3 + 512, this, 3, &main_event_loop_task_handle_);'
          new = '}, "main_event_loop", 2048 * 4, this, 3, &main_event_loop_task_handle_);'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: main_event_loop pattern count={text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('main/audio/audio_service.cc')
          text = p.read_text(encoding='utf-8')
          input_old = '}, "audio_input", 1024 * 3, this, 8, &audio_input_task_handle_'
          output_old = '}, "audio_output", 1024 * 3, this, 4, &audio_output_task_handle_);'
          if text.count(input_old) != 2 or text.count(output_old) != 2:
              raise SystemExit(f'{p}: audio_input={text.count(input_old)}, audio_output={text.count(output_old)}')

          text = text.replace(
              '}, "audio_input", 1024 * 3, this, 8, &audio_input_task_handle_, 0);',
              '}, "audio_input", 2048 * 3, this, 8, &audio_input_task_handle_, 0);',
              1)
          text = text.replace(
              '}, "audio_output", 1024 * 3, this, 4, &audio_output_task_handle_);',
              '}, "audio_output", 2048 * 2, this, 4, &audio_output_task_handle_);',
              1)
          text = text.replace(
              '}, "audio_input", 1024 * 3, this, 8, &audio_input_task_handle_);',
              '}, "audio_input", 2048 * 2, this, 8, &audio_input_task_handle_);',
              1)
          text = text.replace(
              '}, "audio_output", 1024 * 3, this, 4, &audio_output_task_handle_);',
              '}, "audio_output", 2048, this, 4, &audio_output_task_handle_);',
              1)

          opus_old = '}, "opus_codec", 1024 * 25, this, 2, &opus_codec_task_handle_);'
          opus_new = '}, "opus_codec", 2048 * 13, this, 2, &opus_codec_task_handle_);'
          if text.count(opus_old) != 1:
              raise SystemExit(f'{p}: opus pattern count={text.count(opus_old)}')
          p.write_text(text.replace(opus_old, opus_new), encoding='utf-8')

          p = Path('main/audio/wake_words/afe_wake_word.cc')
          text = p.read_text(encoding='utf-8')
          old = '}, "audio_detection", 1024 * 3, this, 3, nullptr);'
          new = '}, "audio_detection", 4096, this, 3, nullptr);'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: audio_detection pattern count={text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify stable talk-button barge-in patch
        shell: bash
        run: |
          grep -n "app.GetDeviceState() == kDeviceStateSpeaking" main/boards/xingzhi-cube-1.83tft-wifi/xingzhi-cube-1.83tft-wifi.cc
          grep -n "app.SetDeviceState(kDeviceStateListening)" main/boards/xingzhi-cube-1.83tft-wifi/xingzhi-cube-1.83tft-wifi.cc

      - name: Verify Fix14 animation and lighting baseline
        shell: bash
        run: |
          H=main/boards/xingzhi-cube-1.83tft-wifi/mochi_lcd_display.h
          grep -n "kAmbientTimerMs = 200" "$H"
          grep -n "kMoveStepPx = 5" "$H"
          grep -n "positions\[\] = {-50, -25, 0, 25, 50}" "$H"
          grep -n "lv_obj_set_size(night_glow_, 54, 54)" "$H"
          grep -n "std::clamp(42 + pulse" "$H"
          grep -n "kIdleSettleTicks" "$H"
          if grep -n "xTaskCreatePinnedToCore" "$H"; then
            echo "Unexpected dedicated ambient FreeRTOS task remains"
            exit 1
          fi

      - name: Verify Pet State Core 15A architecture
        shell: bash
        run: |
          P=main/pet/pet_state_engine.h
          B=main/boards/xingzhi-cube-1.83tft-wifi/xingzhi-cube-1.83tft-wifi.cc
          grep -n "class PetStateEngine" "$P"
          grep -n "int32_t coins = 50" "$P"
          grep -n "bool Feed" "$P"
          grep -n "CompletePlay" "$P"
          grep -n "ShouldAutoSleep" "$P"
          grep -n "PetStateEngine::GetInstance().Initialize" "$B"
          grep -n "PetStateEngine::GetInstance().SaveNow" "$B"
          if grep -nE "xTaskCreate|lv_|esp_sntp|http|websocket" "$P"; then
            echo "Pet core must not own tasks, LVGL, SNTP, or network work"
            exit 1
          fi

      - name: Build corrected 1.83 firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          idf.py --version
          python scripts/release.py xingzhi-cube-1.83tft-wifi --name xingzhi-cube-1.83tft-wifi

      - name: Verify and package APP-only flash image
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          set -euo pipefail
          APP=build/xiaozhi_vn.bin
          test -f "$APP"
          APP_SIZE=$(stat -c%s "$APP")
          APP_LIMIT=$((0x570000))
          if [ "$APP_SIZE" -ge "$APP_LIMIT" ]; then
            echo "APP too large: $APP_SIZE >= $APP_LIMIT"
            exit 1
          fi
          echo "APP size: $APP_SIZE bytes / partition limit $APP_LIMIT bytes"
          python -m esptool --chip esp32s3 image-info "$APP"

          rm -rf flash_package
          mkdir -p flash_package
          cp "$APP" flash_package/MOCHI_PET_STATE_CORE_15A_APP.bin
          cp build/xiaozhi_vn.elf flash_package/
          cp build/xiaozhi_vn.map flash_package/
          sha256sum flash_package/MOCHI_PET_STATE_CORE_15A_APP.bin | tee flash_package/SHA256.txt
          cat > flash_package/FLASH_INSTRUCTIONS.txt <<'EOF'
          MOCHI PET STATE CORE 15A - APP ONLY

          Baseline: Fix14 hardware-PASS
          Branch: mochi-pet-state-core-15a

          Flash ONLY this APP image at 0x20000.
          Do NOT erase flash.
          Do NOT flash merged-binary.bin at 0x0.
          Assets are unchanged from Fix14.

          Windows example (replace COM5 if needed):
          python -m esptool --chip esp32s3 --port COM5 --baud 921600 write-flash 0x20000 MOCHI_PET_STATE_CORE_15A_APP.bin

          Hardware smoke test:
          1. Boot normally; saved Wi-Fi must remain.
          2. Wait for Mochi/background to settle; no reboot loop.
          3. Run 10-20 voice Q&A exchanges.
          4. During TTS press talk: TTS must abort and device must immediately listen.
          5. Leave idle for several minutes and check normal Fix14 animation/background.

          15A intentionally adds only the hidden pet/economy core. Minigames, food UI,
          state-aware idle behavior and auto-sleep visuals come in later staged builds.
          EOF

      - name: Upload APP-only firmware and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: mochi_pet_state_core_15a_app_${{ github.sha }}
          path: flash_package/
          if-no-files-found: error
          retention-days: 30
