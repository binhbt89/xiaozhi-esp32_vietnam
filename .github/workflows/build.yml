name: Build Mochi Pet Behavior V1 15C

on:
  push:
    branches:
      - mochi-pet-behavior-v1-15c

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi pet behavior V1 15C
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore factory-era task stack sizes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main/application.cc')
          text = p.read_text(encoding='utf-8')
          old = '}, "main_event_loop", 1024 * 3 + 512, this, 3, &main_event_loop_task_handle_);'
          new = '}, "main_event_loop", 2048 * 4, this, 3, &main_event_loop_task_handle_);'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: main_event_loop pattern count={text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('main/audio/audio_service.cc')
          text = p.read_text(encoding='utf-8')
          input_old = '}, "audio_input", 1024 * 3, this, 8, &audio_input_task_handle_'
          output_old = '}, "audio_output", 1024 * 3, this, 4, &audio_output_task_handle_);'
          if text.count(input_old) != 2 or text.count(output_old) != 2:
              raise SystemExit(f'{p}: audio_input={text.count(input_old)}, audio_output={text.count(output_old)}')

          text = text.replace(
              '}, "audio_input", 1024 * 3, this, 8, &audio_input_task_handle_, 0);',
              '}, "audio_input", 2048 * 3, this, 8, &audio_input_task_handle_, 0);',
              1)
          text = text.replace(
              '}, "audio_output", 1024 * 3, this, 4, &audio_output_task_handle_);',
              '}, "audio_output", 2048 * 2, this, 4, &audio_output_task_handle_);',
              1)
          text = text.replace(
              '}, "audio_input", 1024 * 3, this, 8, &audio_input_task_handle_);',
              '}, "audio_input", 2048 * 2, this, 8, &audio_input_task_handle_);',
              1)
          text = text.replace(
              '}, "audio_output", 1024 * 3, this, 4, &audio_output_task_handle_);',
              '}, "audio_output", 2048, this, 4, &audio_output_task_handle_);',
              1)

          opus_old = '}, "opus_codec", 1024 * 25, this, 2, &opus_codec_task_handle_);'
          opus_new = '}, "opus_codec", 2048 * 13, this, 2, &opus_codec_task_handle_);'
          if text.count(opus_old) != 1:
              raise SystemExit(f'{p}: opus pattern count={text.count(opus_old)}')
          p.write_text(text.replace(opus_old, opus_new), encoding='utf-8')

          p = Path('main/audio/wake_words/afe_wake_word.cc')
          text = p.read_text(encoding='utf-8')
          old = '}, "audio_detection", 1024 * 3, this, 3, nullptr);'
          new = '}, "audio_detection", 4096, this, 3, nullptr);'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: audio_detection pattern count={text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Keep 15B bootstrap behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main/application.cc')
          text = p.read_text(encoding='utf-8')

          old = 'const int MAX_RETRY = 10;'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: MAX_RETRY pattern count={text.count(old)}')
          text = text.replace(old, 'const int MAX_RETRY = 3;', 1)

          old = 'int retry_delay = 10; // Initial retry delay is 10 seconds'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: initial retry delay pattern count={text.count(old)}')
          text = text.replace(old, 'int retry_delay = 5; // Mochi bootstrap: bounded retry', 1)

          old = 'retry_delay = 10; // Reset retry delay time'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: reset retry delay pattern count={text.count(old)}')
          text = text.replace(old, 'retry_delay = 5; // Reset bounded bootstrap retry', 1)

          old = 'display->SetStatus(Lang::Strings::CHECKING_NEW_VERSION);'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: checking-version status pattern count={text.count(old)}')
          text = text.replace(old, 'display->SetStatus(Lang::Strings::LOADING_PROTOCOL);', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Integrate pet lifecycle into Application idle clock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main/application.cc')
          text = p.read_text(encoding='utf-8')

          old = '#include "settings.h"\n#include "ota_server.h"'
          new = '#include "settings.h"\n#include "pet/pet_state_engine.h"\n#include "ota_server.h"'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: pet include anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        if (bits & MAIN_EVENT_CLOCK_TICK) {
            clock_ticks_++;
            auto display = Board::GetInstance().GetDisplay();
            display->UpdateStatusBar();
        
            // Print the debug info every 10 seconds'''
          new = '''        if (bits & MAIN_EVENT_CLOCK_TICK) {
            clock_ticks_++;
            auto display = Board::GetInstance().GetDisplay();
            display->UpdateStatusBar();

            // Pet lifecycle work belongs on the Application main loop, never
            // the 200ms LVGL timer. Every five idle seconds is ample for state
            // drift, auto sleep/wake, and coalesced NVS checkpoints.
            if (device_state_ == kDeviceStateIdle && clock_ticks_ % 5 == 0) {
                PetStateEngine::GetInstance().ServiceIdleLifecycle();
            }
        
            // Print the debug info every 10 seconds'''
          if text.count(old) != 1:
              raise SystemExit(f'{p}: clock lifecycle anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify stable talk-button barge-in patch
        shell: bash
        run: |
          grep -n "app.GetDeviceState() == kDeviceStateSpeaking" main/boards/xingzhi-cube-1.83tft-wifi/xingzhi-cube-1.83tft-wifi.cc
          grep -n "app.SetDeviceState(kDeviceStateListening)" main/boards/xingzhi-cube-1.83tft-wifi/xingzhi-cube-1.83tft-wifi.cc

      - name: Verify Fix14 animation and lighting baseline
        shell: bash
        run: |
          H=main/boards/xingzhi-cube-1.83tft-wifi/mochi_lcd_display.h
          grep -n "kAmbientTimerMs = 200" "$H"
          grep -n "kMoveStepPx = 5" "$H"
          grep -n "positions\[\] = {-50, -25, 0, 25, 50}" "$H"
          grep -n "lv_obj_set_size(night_glow_, 54, 54)" "$H"
          grep -n "std::clamp(42 + pulse" "$H"
          grep -n "kIdleSettleTicks" "$H"
          if grep -n "xTaskCreatePinnedToCore" "$H"; then
            echo "Unexpected dedicated ambient FreeRTOS task remains"
            exit 1
          fi

      - name: Verify 15B OTA and WiFi baseline
        shell: bash
        run: |
          P=main/pet/pet_state_engine.h
          W=main/boards/common/wifi_board.cc
          O=main/ota.h
          A=main/application.cc

          grep -n "bool HasNewVersion() { return false; }" "$O"
          grep -n "while (!wifi_station.WaitForConnected(60 \* 1000))" "$W"
          grep -n "Saved WiFi is still unavailable" "$W"
          grep -n "const int MAX_RETRY = 3" "$A"
          grep -n "Lang::Strings::LOADING_PROTOCOL" "$A"

          if grep -n "wifi_station.Stop();" "$W"; then
            echo "Saved WiFi must not be stopped after a startup timeout"
            exit 1
          fi

      - name: Verify Pet Behavior V1 15C architecture
        shell: bash
        run: |
          P=main/pet/pet_state_engine.h
          H=main/boards/xingzhi-cube-1.83tft-wifi/mochi_lcd_display.h
          A=main/application.cc

          grep -n "bool manual_sleep = false" "$P"
          grep -n "LifecycleTransition ServiceIdleLifecycle" "$P"
          grep -n "kAutoWakeEnergy = 90" "$P"
          grep -n "ServiceIdleLifecycle" "$A"
          grep -n "pet.sleeping" "$H"
          grep -n "pet.energy <= 35" "$H"
          grep -n "pet.hunger >= 75" "$H"
          grep -n "pet.mood >= 80" "$H"
          grep -n "pet.friendship >= 60" "$H"

          # Pet core remains logic/persistence only.
          if grep -nE "xTaskCreate|lv_|esp_sntp|http|websocket" "$P"; then
            echo "Pet core must not own tasks, LVGL, SNTP, or network work"
            exit 1
          fi

          # Persistent lifecycle may write NVS only from Application main loop;
          # the LVGL display layer must never call Sleep/Wake/Save methods.
          if grep -nE "\.Sleep\(|\.Wake\(|SaveNow\(|ServiceIdleLifecycle" "$H"; then
            echo "LVGL layer must be read-only with respect to persistent pet state"
            exit 1
          fi

      - name: Build corrected 1.83 firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          idf.py --version
          python scripts/release.py xingzhi-cube-1.83tft-wifi --name xingzhi-cube-1.83tft-wifi

      - name: Verify and package APP-only flash image
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          set -euo pipefail
          APP=build/xiaozhi_vn.bin
          test -f "$APP"
          APP_SIZE=$(stat -c%s "$APP")
          APP_LIMIT=$((0x570000))
          if [ "$APP_SIZE" -ge "$APP_LIMIT" ]; then
            echo "APP too large: $APP_SIZE >= $APP_LIMIT"
            exit 1
          fi
          echo "APP size: $APP_SIZE bytes / partition limit $APP_LIMIT bytes"
          python -m esptool --chip esp32s3 image_info "$APP"

          rm -rf flash_package
          mkdir -p flash_package
          cp "$APP" flash_package/MOCHI_PET_BEHAVIOR_V1_15C_APP.bin
          cp build/xiaozhi_vn.elf flash_package/
          cp build/xiaozhi_vn.map flash_package/
          sha256sum flash_package/MOCHI_PET_BEHAVIOR_V1_15C_APP.bin | tee flash_package/SHA256.txt
          cat > flash_package/FLASH_INSTRUCTIONS.txt <<'EOF'
          MOCHI PET BEHAVIOR V1 15C - APP ONLY

          Baseline: Runtime Foundation 15B hardware-PASS.
          Branch: mochi-pet-behavior-v1-15c

          Flash ONLY this APP image at 0x20000.
          Do NOT erase flash.
          Do NOT flash merged-binary.bin at 0x0.
          Assets are unchanged from Fix14/15B.

          Windows example (replace COM5 if needed):
          python -m esptool --chip esp32s3 --port COM5 --baud 921600 write-flash 0x20000 MOCHI_PET_BEHAVIOR_V1_15C_APP.bin

          15C changes:
          - Hunger/Energy/Mood/Friendship now bias existing idle behavior.
          - Logical sleeping forces ambient_sleep while Application is Idle.
          - Voice remains higher priority; animation pauses during listening/speaking and resumes after idle settle.
          - Auto sleep at Energy <=20, auto wake at Energy >=90.
          - Manual Sleep is separately persisted and never auto-wakes.
          - Pet lifecycle/NVS service runs on Application main loop every 5 idle seconds, never in LVGL timer.
          - No new assets, tasks, touch UI, minigames, or physical-button remapping.

          Hardware regression test:
          1. APP-only flash without erase; Wi-Fi/NVS must remain.
          2. Boot normally; no reboot loop/Guru Meditation.
          3. 10-20 voice Q&A exchanges.
          4. Interrupt TTS with Talk; it must immediately listen.
          5. Leave idle 15-30 minutes and verify background/movement stay smooth.
          6. Repeat 15B Wi-Fi outage recovery test if convenient.

          State-specific behavior uses the existing animation set, so the main
          purpose of this build is to validate that state-aware reads and the
          5-second lifecycle service do not affect voice/LVGL stability.
          EOF

      - name: Upload APP-only firmware and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: mochi_pet_behavior_v1_15c_app_${{ github.sha }}
          path: flash_package/
          if-no-files-found: error
          retention-days: 30
