name: Build Mochi Stable UI 06

on:
  push:
    branches:
      - mochi-ui-stable-06

permissions:
  contents: read

jobs:
  build:
    name: Build xingzhi-cube-1.54tft-wifi
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mochi Xingzhi Wi-Fi
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py xingzhi-cube-1.54tft-wifi --name xingzhi-cube-1.54tft-wifi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochi_stable_ui_06_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
          retention-days: 30
