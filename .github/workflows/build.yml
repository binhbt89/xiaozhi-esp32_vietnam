name: Build Mochi HUD Polish 15E

on:
  push:
    branches:
      - mochi-hud-polish-icons-15e

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi HUD polish 15E
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore factory-era task stack sizes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main/application.cc')
          text = p.read_text(encoding='utf-8')
          old = '}, "main_event_loop", 1024 * 3 + 512, this, 3, &main_event_loop_task_handle_);'
          new = '}, "main_event_loop", 2048 * 4, this, 3, &main_event_loop_task_handle_);'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: main_event_loop pattern count={text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('main/audio/audio_service.cc')
          text = p.read_text(encoding='utf-8')
          input_old = '}, "audio_input", 1024 * 3, this, 8, &audio_input_task_handle_'
          output_old = '}, "audio_output", 1024 * 3, this, 4, &audio_output_task_handle_);'
          if text.count(input_old) != 2 or text.count(output_old) != 2:
              raise SystemExit(f'{p}: audio_input={text.count(input_old)}, audio_output={text.count(output_old)}')

          text = text.replace(
              '}, "audio_input", 1024 * 3, this, 8, &audio_input_task_handle_, 0);',
              '}, "audio_input", 2048 * 3, this, 8, &audio_input_task_handle_, 0);',
              1)
          text = text.replace(
              '}, "audio_output", 1024 * 3, this, 4, &audio_output_task_handle_);',
              '}, "audio_output", 2048 * 2, this, 4, &audio_output_task_handle_);',
              1)
          text = text.replace(
              '}, "audio_input", 1024 * 3, this, 8, &audio_input_task_handle_);',
              '}, "audio_input", 2048 * 2, this, 8, &audio_input_task_handle_);',
              1)
          text = text.replace(
              '}, "audio_output", 1024 * 3, this, 4, &audio_output_task_handle_);',
              '}, "audio_output", 2048, this, 4, &audio_output_task_handle_);',
              1)

          opus_old = '}, "opus_codec", 1024 * 25, this, 2, &opus_codec_task_handle_);'
          opus_new = '}, "opus_codec", 2048 * 13, this, 2, &opus_codec_task_handle_);'
          if text.count(opus_old) != 1:
              raise SystemExit(f'{p}: opus pattern count={text.count(opus_old)}')
          p.write_text(text.replace(opus_old, opus_new), encoding='utf-8')

          p = Path('main/audio/wake_words/afe_wake_word.cc')
          text = p.read_text(encoding='utf-8')
          old = '}, "audio_detection", 1024 * 3, this, 3, nullptr);'
          new = '}, "audio_detection", 4096, this, 3, nullptr);'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: audio_detection pattern count={text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Keep 15B bootstrap behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main/application.cc')
          text = p.read_text(encoding='utf-8')

          old = 'const int MAX_RETRY = 10;'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: MAX_RETRY pattern count={text.count(old)}')
          text = text.replace(old, 'const int MAX_RETRY = 3;', 1)

          old = 'int retry_delay = 10; // Initial retry delay is 10 seconds'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: initial retry delay pattern count={text.count(old)}')
          text = text.replace(old, 'int retry_delay = 5; // Mochi bootstrap: bounded retry', 1)

          old = 'retry_delay = 10; // Reset retry delay time'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: reset retry delay pattern count={text.count(old)}')
          text = text.replace(old, 'retry_delay = 5; // Reset bounded bootstrap retry', 1)

          old = 'display->SetStatus(Lang::Strings::CHECKING_NEW_VERSION);'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: checking-version status pattern count={text.count(old)}')
          text = text.replace(old, 'display->SetStatus(Lang::Strings::LOADING_PROTOCOL);', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Integrate pet lifecycle into Application idle clock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main/application.cc')
          text = p.read_text(encoding='utf-8')

          old = '#include "settings.h"\n#include "ota_server.h"'
          new = '#include "settings.h"\n#include "pet/pet_state_engine.h"\n#include "ota_server.h"'
          if text.count(old) != 1:
              raise SystemExit(f'{p}: pet include anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = '            display->UpdateStatusBar();'
          if text.count(anchor) != 1:
              raise SystemExit(f'{p}: status-bar anchor count={text.count(anchor)}')
          lifecycle = '''            display->UpdateStatusBar();

            // Pet lifecycle work belongs on the Application main loop, never
            // the 200ms LVGL timer. Every five idle seconds is ample for state
            // drift, auto sleep/wake, and coalesced NVS checkpoints.
            if (device_state_ == kDeviceStateIdle && clock_ticks_ % 5 == 0) {
                PetStateEngine::GetInstance().ServiceIdleLifecycle();
            }'''
          text = text.replace(anchor, lifecycle, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply 15E HUD polish and 1-second menu hold
        shell: bash
        run: |
          python scripts/patch_mochi_15e.py

      - name: Verify Fix14 voice animation baseline
        shell: bash
        run: |
          B=main/boards/xingzhi-cube-1.83tft-wifi/xingzhi-cube-1.83tft-wifi.cc
          H=main/boards/xingzhi-cube-1.83tft-wifi/mochi_lcd_display.h
          grep -n "app.GetDeviceState() == kDeviceStateSpeaking\|state == kDeviceStateSpeaking" "$B"
          grep -n "app.SetDeviceState(kDeviceStateListening)" "$B"
          grep -n "kAmbientTimerMs = 200" "$H"
          grep -n "kMoveStepPx = 5" "$H"
          grep -n "positions\[\] = {-50, -25, 0, 25, 50}" "$H"
          grep -n "lv_obj_set_size(night_glow_, 54, 54)" "$H"
          grep -n "std::clamp(42 + pulse" "$H"
          grep -n "kIdleSettleTicks" "$H"
          if grep -n "xTaskCreatePinnedToCore" "$H"; then
            echo "Unexpected dedicated ambient FreeRTOS task remains"
            exit 1
          fi

      - name: Verify 15B OTA and WiFi baseline
        shell: bash
        run: |
          W=main/boards/common/wifi_board.cc
          O=main/ota.h
          A=main/application.cc
          grep -n "bool HasNewVersion() { return false; }" "$O"
          grep -n "while (!wifi_station.WaitForConnected(60 \* 1000))" "$W"
          grep -n "Saved WiFi is still unavailable" "$W"
          grep -n "const int MAX_RETRY = 3" "$A"
          grep -n "Lang::Strings::LOADING_PROTOCOL" "$A"
          if grep -n "wifi_station.Stop();" "$W"; then
            echo "Saved WiFi must not be stopped after a startup timeout"
            exit 1
          fi

      - name: Verify 15C and 15D pet foundations
        shell: bash
        run: |
          P=main/pet/pet_state_engine.h
          A=main/application.cc
          H=main/boards/xingzhi-cube-1.83tft-wifi/mochi_lcd_display.h

          grep -n "bool manual_sleep = false" "$P"
          grep -n "LifecycleTransition ServiceIdleLifecycle" "$P"
          grep -n "kAutoWakeEnergy = 90" "$P"
          grep -n "ServiceIdleLifecycle" "$A"
          grep -n "uint8_t fullness = 84" "$P"
          grep -n "kSchemaVersion = 2" "$P"
          grep -n "kMaxStat = 99" "$P"
          grep -n "kMaxCoins = 999" "$P"
          grep -n "RequestMenuToggle" "$H"
          grep -n "RequestMenuMove" "$H"
          grep -n "RequestMenuSelect" "$H"

          if grep -nE "xTaskCreate|lv_|esp_sntp|http|websocket" "$P"; then
            echo "Pet core must not own tasks, LVGL, SNTP, or network work"
            exit 1
          fi

      - name: Verify HUD Polish 15E
        shell: bash
        run: |
          H=main/boards/xingzhi-cube-1.83tft-wifi/mochi_lcd_display.h
          B=main/boards/xingzhi-cube-1.83tft-wifi/xingzhi-cube-1.83tft-wifi.cc

          grep -n "kHudWidthPx = 30" "$H"
          grep -n "kHudRightMarginPx = 8" "$H"
          grep -n "kHudTopGapPx = 4" "$H"
          grep -n "kHudBottomSafePx = 16" "$H"
          grep -n "CreateHudIconLvgl" "$H"
          grep -n "MakeHudShapeLvgl" "$H"
          grep -n "Fullness: warm food bowl" "$H"
          grep -n "Energy: compact blocky lightning bolt" "$H"
          grep -n "Mood: small smiling face" "$H"
          grep -n "Friendship: pixel-heart silhouette" "$H"
          grep -n "Coin: gold coin" "$H"
          grep -n "lv_obj_set_size(row, 27, 30)" "$H"
          grep -n "lv_obj_set_width(hud_value_labels_\[i\], 27)" "$H"
          grep -n "MOCHI_MENU_LONG_PRESS_MS 1000" "$B"
          grep -n "boot_button_(BOOT_BUTTON_GPIO, false, MOCHI_MENU_LONG_PRESS_MS, 50)" "$B"
          grep -n "boot_button_.OnPressDown" "$B"
          grep -n "boot_button_.OnLongPress" "$B"
          grep -n "boot_button_.OnPressUp" "$B"

          if grep -n "kHudIcons" "$H"; then
            echo "15E HUD must not use temporary text/font icons"
            exit 1
          fi
          if grep -n "MOCHI_MENU_LONG_PRESS_MS 2000" "$B"; then
            echo "15E must use a one-second Talk hold"
            exit 1
          fi
          if grep -n "boot_button_.OnClick" "$B"; then
            echo "Talk must not register OnClick; release-after-long protection required"
            exit 1
          fi
          if grep -n "xTaskCreatePinnedToCore\|xTaskCreate(" "$H"; then
            echo "15E UI must not add a FreeRTOS task"
            exit 1
          fi

      - name: Build corrected 1.83 firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          idf.py --version
          python scripts/release.py xingzhi-cube-1.83tft-wifi --name xingzhi-cube-1.83tft-wifi

      - name: Verify and package APP-only flash image
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          set -euo pipefail
          APP=build/xiaozhi_vn.bin
          test -f "$APP"
          APP_SIZE=$(stat -c%s "$APP")
          APP_LIMIT=$((0x570000))
          if [ "$APP_SIZE" -ge "$APP_LIMIT" ]; then
            echo "APP too large: $APP_SIZE >= $APP_LIMIT"
            exit 1
          fi
          echo "APP size: $APP_SIZE bytes / partition limit $APP_LIMIT bytes"
          python -m esptool --chip esp32s3 image_info "$APP"

          rm -rf flash_package
          mkdir -p flash_package
          cp "$APP" flash_package/MOCHI_HUD_POLISH_ICONS_15E_APP.bin
          cp build/xiaozhi_vn.elf flash_package/
          cp build/xiaozhi_vn.map flash_package/
          (cd flash_package && sha256sum MOCHI_HUD_POLISH_ICONS_15E_APP.bin > SHA256.txt)
          cat > flash_package/FLASH_INSTRUCTIONS.txt <<'EOF'
          MOCHI HUD POLISH + CUSTOM ICONS 15E - APP ONLY

          Baseline: HUD Menu Foundation 15D hardware-PASS.
          Branch: mochi-hud-polish-icons-15e

          Flash ONLY this APP image at 0x20000.
          Do NOT erase flash.
          Do NOT flash merged-binary.bin at 0x0.
          Background/pet assets are unchanged.

          Windows example (replace COM5 if needed):
          python -m esptool --chip esp32s3 --port COM5 --baud 921600 write-flash 0x20000 MOCHI_HUD_POLISH_ICONS_15E_APP.bin

          15E changes:
          - Talk menu long-press reduced from 2 seconds to 1 second.
          - Release-after-long protection remains unchanged; opening menu must not start voice.
          - HUD remains ONE narrow right-side column: icon above, value below.
          - HUD width reduced from 38px to 30px and shifted 8px inward from the right edge.
          - Bottom safe margin added so Coin does not sit in the rounded lower-right corner.
          - Temporary N / + / :) / <3 / $ glyphs removed.
          - Five icons are hand-drawn with tiny LVGL geometry: food bowl, lightning, smile, heart, coin.
          - No icon font and no new external asset partition.
          - Fullness/Energy/Mood/Friendship remain 00..99; Coin remains 000..999.
          - Voice, Wi-Fi, OTA, pet logic, backgrounds and animation baseline are unchanged.

          Hardware test focus:
          1. Verify the top system status bar is still unobstructed.
          2. Verify every HUD icon is clearly separated from its number underneath.
          3. Verify the entire HUD is narrower and leaves more scenery visible.
          4. Verify Coin/000..999 stays clear of the lower-right rounded corner.
          5. Hold Talk about 1 second: menu opens/closes; release must NOT start voice.
          6. Menu navigation and Pet/Play/Sleep/Wake remain functional.
          7. Outside menu, Talk short and TTS barge-in remain identical to 15D.
          8. Run normal voice/idle regression testing and watch for reboot/Guru Meditation.
          EOF

      - name: Upload APP-only firmware and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: mochi_hud_polish_icons_15e_app_${{ github.sha }}
          path: flash_package/
          if-no-files-found: error
          retention-days: 30
