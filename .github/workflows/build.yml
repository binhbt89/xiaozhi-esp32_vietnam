name: Build Mochi Stability Fix 08

on:
  push:
    branches:
      - mochi-stability-fix-08

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi stability fix 08
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore factory-era task stack sizes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = {
              Path('main/application.cc'): [
                  ('}, "main_event_loop", 1024 * 3 + 512, this, 3, &main_event_loop_task_handle_);',
                   '}, "main_event_loop", 2048 * 4, this, 3, &main_event_loop_task_handle_);'),
              ],
              Path('main/audio/audio_service.cc'): [
                  ('}, "audio_input", 1024 * 3, this, 8, &audio_input_task_handle_, 0);',
                   '}, "audio_input", 2048 * 3, this, 8, &audio_input_task_handle_, 0);'),
                  ('}, "audio_output", 1024 * 3, this, 4, &audio_output_task_handle_);',
                   '}, "audio_output", 2048 * 2, this, 4, &audio_output_task_handle_);'),
                  ('}, "opus_codec", 1024 * 25, this, 2, &opus_codec_task_handle_);',
                   '}, "opus_codec", 2048 * 13, this, 2, &opus_codec_task_handle_);'),
              ],
              Path('main/audio/wake_words/afe_wake_word.cc'): [
                  ('}, "audio_detection", 1024 * 3, this, 3, nullptr);',
                   '}, "audio_detection", 4096, this, 3, nullptr);'),
              ],
          }

          for path, replacements in patches.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              print(f'patched {path}')
          PY

          grep -n 'main_event_loop"' main/application.cc
          grep -nE 'audio_input"|audio_output"|opus_codec"' main/audio/audio_service.cc
          grep -n 'audio_detection"' main/audio/wake_words/afe_wake_word.cc

      - name: Build corrected 1.83 firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          idf.py --version
          python scripts/release.py xingzhi-cube-1.83tft-wifi --name xingzhi-cube-1.83tft-wifi
          echo 'Debug artifacts:'
          find build -type f \( -name '*.elf' -o -name '*.map' -o -name 'merged-binary.bin' \) -print || true

      - name: Upload firmware and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: mochi_stability_fix08_${{ github.sha }}
          path: |
            build/merged-binary.bin
            build/**/*.elf
            build/**/*.map
          if-no-files-found: error
          retention-days: 30
